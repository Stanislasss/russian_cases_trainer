name: russian-cases-trainer

# server and importer binaries share one image.
x-backend: &backend
  build: ./backend
  image: russian-cases-trainer-backend
  env_file: .env

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    <<: *backend
    command: ["server", "migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    command: ["server", "serve"]
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      API_PROXY_TARGET: http://backend:8080
      # File events don't cross the Windows bind mount, so Vite polls.
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Keep the container's Linux node_modules instead of the host's.
      - /app/node_modules
    depends_on:
      - backend

  importer:
    <<: *backend
    profiles: [tools]
    command: ["importer"]
    environment:
      IMPORT_DATA_DIR: /data
    volumes:
      - importer-data:/data
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  adminer:
    image: adminer
    profiles: [tools]
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  pgdata:
  importer-data:
