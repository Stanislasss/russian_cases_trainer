name: russian-cases-trainer

# server and importer binaries share one image.
x-backend: &backend
  build: ./backend
  image: russian-cases-trainer-backend
  env_file: .env

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    <<: *backend
    command: ["server", "migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    command: ["server", "serve"]
    environment:
      TTS_URL: http://tts:5000
      SPEECH_CACHE_DIR: /speech-cache
    ports:
      - "8080:8080"
    volumes:
      - speech-cache:/speech-cache
    depends_on:
      # Not waited on: without it the game just has no sound.
      tts:
        condition: service_started
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Russian text-to-speech (Piper). The test page on http://localhost:5002 is for
  # comparing voices; the backend uses http://tts:5000.
  tts:
    build: ./tts
    ports:
      - "5002:5000"

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      API_PROXY_TARGET: http://backend:8080
      # File events don't cross the Windows bind mount, so Vite polls.
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Keep the container's Linux node_modules instead of the host's.
      - /app/node_modules
    depends_on:
      - backend

  importer:
    <<: *backend
    profiles: [tools]
    command: ["importer"]
    environment:
      IMPORT_DATA_DIR: /data
    volumes:
      - importer-data:/data
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Rust toolchain for tests/clippy/fmt: `just cargo <args>`.
  cargo:
    profiles: [tools]
    build:
      context: ./backend
      target: toolbox
    entrypoint: ["cargo"]
    env_file: .env
    volumes:
      - ./backend:/app
      - cargo-registry:/usr/local/cargo/registry
      # Linux build output stays in a volume, apart from any host target/ dir.
      - cargo-target:/app/target
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer
    profiles: [tools]
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  pgdata:
  importer-data:
  cargo-registry:
  cargo-target:
  speech-cache:
