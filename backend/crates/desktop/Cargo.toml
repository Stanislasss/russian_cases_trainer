[package]
name = "desktop"
description = "Russian Cases Trainer as a desktop app (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Built on GitHub Actions (it needs each system's webview libraries), not by
# `just check`: see `default-members` in the workspace.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
server = { path = "../server" }
anyhow.workspace = true
# used by tauri::generate_context!
serde_json.workspace = true
sys-locale = "0.3"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
