# Checks every pull request and push to main: the same as `just check` and the
# frontend's npm scripts, plus a compile check of the desktop app.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: trainer
          POSTGRES_PASSWORD: trainer
          POSTGRES_DB: trainer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trainer"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # sqlx::test creates a database per test.
      DATABASE_URL: postgres://trainer:trainer@localhost:5432/trainer
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude desktop

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  desktop:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Webview libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: desktop
          cache-on-failure: true
      # The bundle's resources must exist; the release workflow builds the real ones.
      - name: Stand-in resources
        run: mkdir -p ../frontend/dist ../build && touch ../build/lexicon.sqlite
      - run: cargo clippy -p desktop --all-targets -- -D warnings
