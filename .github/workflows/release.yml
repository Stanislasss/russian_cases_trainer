# Builds the desktop app for Windows, macOS and Linux when a version tag is
# pushed, and publishes the installers plus the auto-update manifest as a
# *draft* release in the public releases repository. Publishing the draft
# makes it the version that installed apps update to.
#
# Releasing: set `version` in backend/Cargo.toml, commit, then tag `v<version>`.
#
# Secrets (repository settings → Secrets and variables → Actions):
# - TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD: signs updates
#   (`npx @tauri-apps/cli signer generate`); its public key is in tauri.conf.json.
# - RELEASES_REPO_TOKEN: fine-grained token with "Contents: read and write" on
#   the releases repository only.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  RELEASES_OWNER: Stanislasss
  RELEASES_REPO: russian-cases-trainer-releases

jobs:
  lexicon:
    name: Word list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the app version
        run: |
          version=$(grep -m1 '^version' backend/Cargo.toml | cut -d '"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but backend/Cargo.toml says $version"
            exit 1
          fi
      # The finished word list, rebuilt only when the code that shapes it changes.
      - uses: actions/cache@v6
        id: lexicon
        with:
          path: build/lexicon.sqlite
          key: lexicon-${{ hashFiles('backend/crates/importer/**', 'backend/crates/domain/**', 'backend/crates/infrastructure/src/sqlite/**', 'backend/crates/infrastructure/src/lexicon.rs', 'backend/migrations-sqlite/lexicon.sql') }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.lexicon.outputs.cache-hit != 'true'
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.lexicon.outputs.cache-hit != 'true'
        with:
          workspaces: backend
          key: importer
          cache-on-failure: true
      # OpenRussian and Wiktionary downloads (about 1.9 GB), kept between releases.
      - uses: actions/cache@v6
        if: steps.lexicon.outputs.cache-hit != 'true'
        with:
          path: import-data
          key: import-data-${{ hashFiles('backend/crates/importer/src/openrussian.rs', 'backend/crates/importer/src/wiktionary.rs') }}
          restore-keys: import-data-
      - name: Build lexicon.sqlite
        if: steps.lexicon.outputs.cache-hit != 'true'
        working-directory: backend
        run: cargo run --release -p importer -- --sqlite ../build/lexicon.sqlite --data-dir ../import-data
      - uses: actions/upload-artifact@v7
        with:
          name: lexicon
          path: build/lexicon.sqlite

  bundle:
    name: ${{ matrix.name }}
    needs: lexicon
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libsoup-3.0-dev patchelf
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: npm ci && npm run build
      - uses: actions/download-artifact@v8
        with:
          name: lexicon
          path: build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend
          key: ${{ matrix.target }}
          cache-on-failure: true
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: backend/crates/desktop
          tauriScript: npx --yes @tauri-apps/cli@2
          args: --target ${{ matrix.target }}
          owner: ${{ env.RELEASES_OWNER }}
          repo: ${{ env.RELEASES_REPO }}
          tagName: ${{ github.ref_name }}
          # The tag goes on the releases repository's own branch: this
          # repository's commits don't exist there.
          releaseCommitish: main
          releaseName: Russian Cases Trainer ${{ github.ref_name }}
          releaseBody: |
            Download the file for your system below. The app isn't signed yet, so the
            first launch shows a warning; see the README for how to open it anyway.
          releaseDraft: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
