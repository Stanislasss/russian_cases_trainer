# Monthly pull requests that update dependencies, including the actions pinned
# to commit SHAs in the workflows (Dependabot moves the SHA and its comment).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: monthly
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
